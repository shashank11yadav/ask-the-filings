services:
  db:
    image: pgvector/pgvector:pg16
    environment:  # local development only; matches the default DATABASE_URL
      POSTGRES_USER: filings
      POSTGRES_PASSWORD: filings
      POSTGRES_DB: filings
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
