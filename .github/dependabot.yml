version: 2
updates:
  - package-ecosystem: uv
    directory: /
    cooldown:
      default-days: 3
      semver-major-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 3
      semver-major-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    cooldown:
      default-days: 3
      semver-major-days: 7
    schedule:
      interval: weekly
