[project]
name = "ask-the-filings"
version = "0.1.0"
description = "Eval-driven RAG over SEC 10-K filings"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.32",
    "pydantic-settings>=2.4",
    "google-genai>=2.29.0",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
